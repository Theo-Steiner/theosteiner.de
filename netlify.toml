[build]
  command = "pnpm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "24"

# `og` loads the appropriate Japanese font slice at runtime. Netlify's tracer
# cannot infer those filenames from the Fontsource CSS, so retain them in the
# generated SvelteKit server function.
[functions]
  included_files = [
    "node_modules/@fontsource/noto-sans-jp/files/*.woff"
  ]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=4000"
    # in loving memory
    X-Clacks-Overhead = "GNU Terry Pratchett"

[[headers]]
  for = "/resume"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
