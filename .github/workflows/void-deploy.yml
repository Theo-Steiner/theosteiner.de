name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: void-cloudflare-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy
        env:
          # Add this scoped token at Settings → Secrets and variables → Actions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Fresh checkouts don't have .void/cloudflare.json, which records this.
          CLOUDFLARE_WORKERS_SUBDOMAIN: theosteiner
        run: pnpm exec void deploy --platform cloudflare
