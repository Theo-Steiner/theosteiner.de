# @svebcomponents/* are maintained by the site owner — install new releases
# immediately instead of waiting out pnpm's built-in 1-day release-age window.
minimumReleaseAgeExclude:
  - '@svebcomponents/*'
allowBuilds:
  # pnpm 11 replaced onlyBuiltDependencies with allowBuilds
  esbuild: true
  sharp: true
